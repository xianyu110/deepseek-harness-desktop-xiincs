[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness desktop app — a Tauri wrapper that hosts the dsh web server"
authors = ["dsh-desktop contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
