[package]
name = "dsh-desktop"
version = "0.3.0"
description = "DeepSeek Harness desktop app — a Tauri wrapper that hosts the dsh web server"
authors = ["dsh-desktop contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Raw WebView2 settings access (disabling the default context menu) —
# see `disable_context_menu` in lib.rs.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }
# Reads the registry's real user+machine PATH — see `effective_path` in
# server.rs.
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
