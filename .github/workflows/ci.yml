name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      # Only Linux needs system deps for the webview/tray bits `cargo check`
      # still needs headers for, even though this job never links a binary.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm install

      # This is the actual point of running on macos-latest/ubuntu-latest:
      # the #[cfg(unix)] branches in server.rs (own_process_group,
      # kill_process_tree's SIGTERM path, ...) are entirely excluded from
      # compilation on Windows — cfg-gated code that doesn't match isn't
      # "compiled but unrun", it's not compiled at all. This is the first
      # point those branches get type-checked, let alone anything closer to
      # verified. Deliberately `cargo check`, not `tauri build`: packaging
      # needs per-platform bundle config, code signing, and a bundled Node
      # binary this project doesn't have for macOS/Linux yet (see
      # ROADMAP.md's P0-2/P1-4) — that's a separate, bigger step from "does
      # the platform-generic Rust code even compile here."
      - run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features
