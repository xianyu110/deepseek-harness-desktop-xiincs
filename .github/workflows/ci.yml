name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      # Only Linux needs system deps for the webview/tray bits `cargo check`
      # still needs headers for, even though this job never links a binary.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm install

      # tauri-build's build script hard-fails cargo check itself if the
      # `bundle.resources` path (resources/runtime, populated by `npm run
      # fetch:node`/`prepare:runtime`) doesn't exist on disk at all — it
      # doesn't need real content for a type-check, just to exist. Fetching
      # the real runtime here would defeat the point (this job exists
      # because the macOS/Linux fetch-node.mjs branches are unverified; a
      # job that depends on them succeeding isn't testing what it claims
      # to). `shell: bash` because windows-latest defaults `run:` to
      # PowerShell, which doesn't understand `mkdir -p`.
      - run: mkdir -p src-tauri/resources/runtime
        shell: bash

      # This is the actual point of running on macos-latest/ubuntu-latest:
      # the #[cfg(unix)] branches in server.rs (own_process_group,
      # kill_process_tree's SIGTERM path, ...) are entirely excluded from
      # compilation on Windows — cfg-gated code that doesn't match isn't
      # "compiled but unrun", it's not compiled at all. This is the first
      # point those branches get type-checked, let alone anything closer to
      # verified. Deliberately `cargo check`, not `tauri build`: packaging
      # needs per-platform bundle config, code signing, and a bundled Node
      # binary this project doesn't have for macOS/Linux yet (see
      # ROADMAP.md's P0-2/P1-4) — that's a separate, bigger step from "does
      # the platform-generic Rust code even compile here."
      - run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features

  # fetch-node.mjs's darwin/linux branches have never run anywhere — this
  # project has only ever shipped a Windows build, so nothing has exercised
  # the download-URL construction, tar.gz extraction (vs. Windows' zip), or
  # chmod +x path. Isolated from the `check` job on purpose: this needs the
  # *real* resources/runtime content, and a failure here is a different
  # question ("does the download/extract logic work on this OS") than a
  # cargo check failure ("does the Rust code compile"). Windows isn't in
  # this matrix — its fetch-node.mjs path is exactly what every existing
  # release build already runs.
  fetch-node:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/fetch-node.mjs
      - name: Verify the fetched binary actually runs
        shell: bash
        run: |
          out="src-tauri/resources/runtime/node"
          test -x "$out" || { echo "::error::$out missing or not executable"; exit 1; }
          "$out" --version
