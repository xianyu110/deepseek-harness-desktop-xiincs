name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - run: npm install
      - run: npm run check:dsh-version

      # Bundling needs its own Node.js (v24, for the reasons in
      # scripts/fetch-node.mjs) plus the dsh runtime — same steps
      # `npm run bundle` chains, run separately here so tauri-action
      # can own just the `tauri build` + sign + release step.
      - run: npm run fetch:node
      - run: npm run prepare:runtime

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DeepSeek Harness Desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true

      # tauri-action's own latest.json generation breaks when productName
      # contains a space (tauri-apps/tauri-action#345, #843, #860 — long
      # open, unresolved) — it logs "Signature not found for the updater
      # JSON. Skipping upload..." and silently omits it. The .sig files it
      # produces are correct; build latest.json from those directly instead
      # of renaming productName (which would break the installed-directory
      # continuity for existing installs).
      - name: Build latest.json (tauri-action's own generation is broken for productName with spaces)
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/build-latest-json.mjs $version "${{ github.ref_name }}"

      - name: Upload latest.json to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" latest.json --clobber --repo ${{ github.repository }}
